name: Validar backend

# Roda o mesmo build que o Render executa (npm run build) e a suíte de testes a cada push/PR que
# toque o backend — para um erro de TypeScript ou um teste quebrado aparecer aqui, antes do Render
# tentar (e falhar) o deploy de verdade.
on:
  push:
    branches: ["main", "9-substituir-o-supabase-por-um-postgres-dockerizado-no-servidor-do-backend"]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - "ops/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - "ops/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build (mesmo comando usado pelo Render)
        run: npm run build

      - name: Testes
        run: npm test

      - name: Smoke test — o servidor compilado sobe e responde /health
        run: |
          node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Servidor respondeu em /health."
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Servidor não respondeu em /health a tempo."
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  database-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL com pgvector — testes unitários e de integração
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Limpar ambiente de testes
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
