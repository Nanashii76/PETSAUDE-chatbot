name: petsaude-tests
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: petsaude_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d petsaude_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    build:
      context: ./backend
      target: build
    environment:
      TEST_DATABASE_URL: postgres://test:test-only@postgres:5432/petsaude_test
    command: ["sh", "-c", "npm test && npm run test:integration"]
    depends_on:
      postgres:
        condition: service_healthy
